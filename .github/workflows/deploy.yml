# Bei jedem Push/Merge auf main: prüfen (Typecheck, Lint, Tests), danach auf dem VPS per SSH
# deploy/update.sh ausführen (git pull + docker compose build + up). Der VPS baut mit seinem
# Build-Cache, das ist viel schneller als jedes Mal ein 3-GB-Image aus der Registry zu laden.
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST         z.B. 72.61.80.20
#   VPS_USER         z.B. root
#   VPS_SSH_KEY      privater Deploy-Schlüssel (siehe README, Abschnitt „Automatisches Deployment“)
# Den Host-Key holt der Job per ssh-keyscan und prüft ihn gegen VPS_HOSTKEY_FINGERPRINT unten
# (ein veraltetes VPS_KNOWN_HOSTS-Secret hatte jedes Deployment scheitern lassen).
name: Prüfen und Deployen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VPS_HOST_FALLBACK: 72.61.80.20
  # Auf dem VPS: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
  VPS_HOSTKEY_FINGERPRINT: SHA256:GHh/ich4FircL7mdODAaH6x70OL6WuDU35ZtnlFhqiE

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deployen:
    needs: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH einrichten
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || env.VPS_HOST_FALLBACK }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::Secret VPS_SSH_KEY ist kein gültiger privater Schlüssel"; exit 1; }
          ssh-keyscan -t ed25519 "$VPS_HOST" 2>/dev/null > ~/.ssh/known_hosts
          FP=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          if [ "$FP" != "$VPS_HOSTKEY_FINGERPRINT" ]; then
            echo "::error::Host-Key von $VPS_HOST passt nicht (erhalten: ${FP:-keiner}, erwartet: $VPS_HOSTKEY_FINGERPRINT)"
            exit 1
          fi
      - name: Update auf dem VPS ausführen
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || env.VPS_HOST_FALLBACK }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        # Der Schlüssel ist auf dem Server per Forced Command auf deploy/update.sh beschränkt.
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" update < /dev/null
