# Bei jedem Push/Merge auf main: prüfen (Typecheck, Lint, Tests), Docker-Image bauen und in die
# GitHub Container Registry legen, danach auf dem VPS das neue Image laden und neu starten.
# Der VPS baut selbst nichts mehr – das schont den (ausgelasteten) Server.
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST         z.B. 72.61.80.20
#   VPS_USER         z.B. root
#   VPS_SSH_KEY      privater Deploy-Schlüssel (siehe README, Abschnitt „Automatisches Deployment“)
#   VPS_KNOWN_HOSTS  Ausgabe von: ssh-keyscan -t ed25519 <VPS_HOST>
name: Prüfen und Deployen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  image:
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/amindouioui/videooutreach:latest
            ghcr.io/amindouioui/videooutreach:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployen:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SSH einrichten
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Update auf dem VPS ausführen
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        # Der Schlüssel ist auf dem Server per Forced Command auf deploy/update.sh beschränkt.
        # Das kurzlebige GITHUB_TOKEN geht über stdin an den Server, damit er das Image laden kann.
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" update
