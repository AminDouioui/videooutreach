# Bei jedem Push/Merge auf main: prüfen (Typecheck, Lint, Tests), Docker-Image bauen und in die
# GitHub Container Registry legen, danach auf dem VPS das neue Image laden und neu starten.
# Der VPS baut selbst nichts mehr – das schont den (ausgelasteten) Server.
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST         z.B. 72.61.80.20
#   VPS_USER         z.B. root
#   VPS_SSH_KEY      privater Deploy-Schlüssel (siehe README, Abschnitt „Automatisches Deployment“)
# Den Host-Key holt der Job per ssh-keyscan und prüft ihn gegen VPS_HOSTKEY_FINGERPRINT unten
# (ein veraltetes VPS_KNOWN_HOSTS-Secret hatte jedes Deployment scheitern lassen).
name: Prüfen und Deployen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VPS_HOST_FALLBACK: 72.61.80.20
  # Auf dem VPS: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
  VPS_HOSTKEY_FINGERPRINT: SHA256:GHh/ich4FircL7mdODAaH6x70OL6WuDU35ZtnlFhqiE

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  image:
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/amindouioui/videooutreach:latest
            ghcr.io/amindouioui/videooutreach:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployen:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SSH einrichten
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || env.VPS_HOST_FALLBACK }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::Secret VPS_SSH_KEY ist kein gültiger privater Schlüssel"; exit 1; }
          ssh-keyscan -t ed25519 "$VPS_HOST" 2>/dev/null > ~/.ssh/known_hosts
          FP=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          if [ "$FP" != "$VPS_HOSTKEY_FINGERPRINT" ]; then
            echo "::error::Host-Key von $VPS_HOST passt nicht (erhalten: ${FP:-keiner}, erwartet: $VPS_HOSTKEY_FINGERPRINT)"
            exit 1
          fi
      - name: Update auf dem VPS ausführen
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || env.VPS_HOST_FALLBACK }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        # Der Schlüssel ist auf dem Server per Forced Command auf deploy/update.sh beschränkt.
        # Das kurzlebige GITHUB_TOKEN geht über stdin an den Server, damit er das Image laden kann.
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" update
