# Mini-nginx nur für /media (Traefik-Variante). Range-Requests sind bei statischen Dateien eingebaut.
server {
    listen 80;
    location /media/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges bytes always;
        access_log off;
        try_files $uri =404;
    }
}
